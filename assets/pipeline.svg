<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Five agent research pipeline with critic revision loop">
<rect width="900" height="230" rx="16" fill="#0b1020"/>
<text x="450.0" y="30" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="3">RESEARCHMULTIAGENTSYSTEM · LIVE PIPELINE</text>
<path id="main" d="M90 96 L810 96" stroke="#334155" stroke-width="2" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" values="0;-22" dur="1s" repeatCount="indefinite"/></path>
<path id="loop" d="M810 132 C810 200 630 200 630 132" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/></path>
<text x="30" y="214" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#64748b">LangGraph · Llama 3.1 8B · Q4_K_M 4-bit · no external API</text>
<text x="720.0" y="214" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#fb923c">score &lt; 7 → revise with feedback</text>
<circle r="7" fill="#fff" opacity=".95"><animate attributeName="cx" values="90;270;450;630;810" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="96;96;96;96;96" dur="5s" repeatCount="indefinite"/><animate attributeName="fill" values="#38bdf8;#818cf8;#a78bfa;#f472b6;#fb923c" dur="5s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#fb923c"><animateMotion dur="2.5s" begin="0s" repeatCount="indefinite" path="M810 132 C810 200 630 200 630 132"/><animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite"/></circle><g><rect x="28" y="62" width="124" height="68" rx="14" fill="#111a33" stroke="#38bdf8" stroke-width="1.6"/>
<rect x="28" y="62" width="124" height="68" rx="14" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;.22;0;0;0;0;0;0;0;0" dur="10s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="90" y="92" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">1. Planner</text>
<text x="90" y="112" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#94a3b8">keyword clusters</text></g><g><rect x="208" y="62" width="124" height="68" rx="14" fill="#111a33" stroke="#818cf8" stroke-width="1.6"/>
<rect x="208" y="62" width="124" height="68" rx="14" fill="#818cf8" opacity="0"><animate attributeName="opacity" values="0;.22;0;0;0;0;0;0;0;0" dur="10s" begin="1.0s" repeatCount="indefinite"/></rect>
<text x="270" y="92" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">2. Scraper</text>
<text x="270" y="112" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#94a3b8">parallel crawl</text></g><g><rect x="388" y="62" width="124" height="68" rx="14" fill="#111a33" stroke="#a78bfa" stroke-width="1.6"/>
<rect x="388" y="62" width="124" height="68" rx="14" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;.22;0;0;0;0;0;0;0;0" dur="10s" begin="2.0s" repeatCount="indefinite"/></rect>
<text x="450" y="92" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">3. Analyzer</text>
<text x="450" y="112" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#94a3b8">dedupe · chunk · embed</text></g><g><rect x="568" y="62" width="124" height="68" rx="14" fill="#111a33" stroke="#f472b6" stroke-width="1.6"/>
<rect x="568" y="62" width="124" height="68" rx="14" fill="#f472b6" opacity="0"><animate attributeName="opacity" values="0;.22;0;0;0;0;0;0;0;0" dur="10s" begin="3.0s" repeatCount="indefinite"/></rect>
<text x="630" y="92" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">4. Writer</text>
<text x="630" y="112" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#94a3b8">RAG drafting</text></g><g><rect x="748" y="62" width="124" height="68" rx="14" fill="#111a33" stroke="#fb923c" stroke-width="1.6"/>
<rect x="748" y="62" width="124" height="68" rx="14" fill="#fb923c" opacity="0"><animate attributeName="opacity" values="0;.22;0;0;0;0;0;0;0;0" dur="10s" begin="4.0s" repeatCount="indefinite"/></rect>
<text x="810" y="92" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">5. Critic</text>
<text x="810" y="112" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#94a3b8">hallucination guard</text></g></svg>